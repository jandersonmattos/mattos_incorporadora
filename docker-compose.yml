version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-incorporadora
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incorporadora

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: incorporadora-app
    restart: always

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/incorporadora

    volumes:
      - .:/app

    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: