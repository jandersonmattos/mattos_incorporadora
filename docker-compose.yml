version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-incorporadora
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incorporadora

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: incorporadora-app
    restart: always

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/incorporadora
      REMINDER_FIXED_RECIPIENTS: mattosincorporadoraltda@gmail.com,janderson.candido@gmail.com
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE}
      EMAIL_REMETENTE_NOME: ${EMAIL_REMETENTE_NOME:-Canteiro de Obras}

    volumes:
      - .:/app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  reminder_scheduler:
    build: .
    container_name: incorporadora-reminder-scheduler
    restart: always

    depends_on:
      - app

    environment:
      API_BASE_URL: http://app:8000
      REMINDER_SCHEDULE_TIME: "08:00"

    volumes:
      - .:/app

    command: python scripts/send_due_reminders_daily.py

volumes:
  postgres_data: